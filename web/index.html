<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imagen</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Imagen</h1>
    <span id="device" class="device"></span>
  </header>

  <main>
    <section class="panel">
      <label>Model
        <select id="model"></select>
      </label>
      <label>Prompt
        <textarea id="prompt" rows="3" placeholder="a lighthouse at dusk, cinematic"></textarea>
      </label>
      <label>Negative prompt
        <textarea id="negative" rows="2" placeholder="blurry, low quality"></textarea>
      </label>

      <div class="grid">
        <label>Steps <input id="steps" type="number" value="30" min="1" max="150" /></label>
        <label>CFG <input id="cfg" type="number" value="7.5" step="0.5" min="0" max="30" /></label>
        <label>Width <input id="width" type="number" value="512" step="64" min="128" max="1536" /></label>
        <label>Height <input id="height" type="number" value="512" step="64" min="128" max="1536" /></label>
        <label class="seed-field">Seed
          <span class="seed-row">
            <input id="seed" type="number" value="-1" />
            <button id="seed-random" type="button" class="ghost icon" title="New random seed">🎲</button>
            <button id="seed-lock" type="button" class="ghost icon" title="Lock seed to reuse it" aria-pressed="false">🔓</button>
          </span>
        </label>
      </div>

      <div id="init-row" class="init-row" hidden>
        <img id="init-thumb" alt="" />
        <div class="init-body">
          <div class="init-title">Starting image (img2img)</div>
          <label>Strength <span id="strength-val">0.60</span>
            <input id="strength" type="range" min="0.1" max="1" step="0.05" value="0.6" />
          </label>
          <div class="hint">low = subtle edit · high = big change</div>
          <button id="clear-init" type="button" class="ghost">Use text-only ✕</button>
        </div>
      </div>

      <div class="actions">
        <button id="go">Generate</button>
      </div>

      <div id="status" class="status"></div>
      <div class="progress"><div id="bar"></div></div>
      <div id="queue" class="queue-list"></div>
    </section>

    <section class="preview">
      <img id="preview" alt="" />
      <button id="download-current" class="overlay-btn" hidden>⤓ Save image</button>
    </section>
  </main>

  <div class="gallery-head">
    <h2 class="gallery-title">Gallery</h2>
    <div id="gallery-controls" class="gallery-controls">
      <button id="select-all" class="ghost" hidden>Select all</button>
      <div id="gallery-actions" class="gallery-actions">
        <span id="sel-count" class="sel-count"></span>
        <label class="zip-toggle"><input type="checkbox" id="zip-option" /> as .zip</label>
        <button id="download-selected" class="ghost">⤓ Download selected</button>
        <button id="delete-selected" class="ghost danger">🗑 Delete selected</button>
        <button id="clear-selection" class="ghost">Clear</button>
      </div>
    </div>
  </div>
  <div id="gallery" class="gallery"></div>
  <div id="pager" class="pager" hidden>
    <button id="prev-page" class="ghost">← Newer</button>
    <span id="page-info" class="page-info"></span>
    <button id="next-page" class="ghost">Older →</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
